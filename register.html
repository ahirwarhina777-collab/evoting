<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | E-VoteSystem</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="navbar"><a class="brand" href="index.html">E-Vote<span>System</span></a><nav><a href="index.html">Home</a><a href="login.html">Login</a></nav></header>
<main class="form-wrap"><form class="form-card" id="registerForm">
  <p class="eyebrow">JOIN THE DEMO</p><h1>Create account</h1><p class="muted">Use fictional details for the expo demonstration.</p>
  <label>Full name</label><input id="name" type="text" placeholder="Your name" required>
  <label>Email</label><input id="email" type="email" placeholder="you@example.com" required>
  <label>Password</label><input id="password" type="password" minlength="6" placeholder="At least 6 characters" required>
  <button class="button full" type="submit">Create account</button><p id="message" class="message"></p>
  <p class="muted center">Already registered ? <a href="login.html">Sign in</a></p>
</form></main>
<script src="app.js?v=3"></script></body></html>
